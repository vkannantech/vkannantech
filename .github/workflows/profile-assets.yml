name: Generate profile assets

on:
  schedule:
    - cron: "30 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_assets.py"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate stat cards
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.PROFILE_STATS_TOKEN != '' }}
          PROFILE_USERNAME: vkannantech
        run: python scripts/generate_profile_assets.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh profile stats"
            git pull --rebase
            git push
          fi
